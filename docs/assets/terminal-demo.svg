<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">agent-context-lint terminal demo</title>
  <desc id="desc">A terminal screenshot showing agent-context-lint finding stale path and destructive command guidance in agent instruction files.</desc>
  <rect width="920" height="500" rx="14" fill="#101418"/>
  <rect x="0" y="0" width="920" height="48" rx="14" fill="#20262d"/>
  <circle cx="28" cy="24" r="7" fill="#ff5f57"/>
  <circle cx="52" cy="24" r="7" fill="#ffbd2e"/>
  <circle cx="76" cy="24" r="7" fill="#28c840"/>
  <text x="108" y="30" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">agent-context-lint</text>
  <text x="34" y="92" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">$ agent-context-lint scan .</text>
  <text x="34" y="132" fill="#d0d7de" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">agent-context-lint scan</text>
  <text x="34" y="164" fill="#d0d7de" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">root: /repo</text>
  <text x="34" y="196" fill="#d0d7de" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">files scanned: 2</text>
  <text x="34" y="228" fill="#d0d7de" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">findings: 2</text>
  <text x="34" y="286" fill="#ffa657" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">[warning] stale-referenced-path AGENTS.md:4</text>
  <text x="58" y="318" fill="#d0d7de" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">Backtick path reference does not exist. (docs/old-plan.md)</text>
  <text x="34" y="374" fill="#ffa657" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">[warning] destructive-command-guidance CLAUDE.md:7</text>
  <text x="58" y="406" fill="#d0d7de" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">Line appears to instruct agents to run a destructive command.</text>
  <rect x="32" y="438" width="190" height="34" rx="6" fill="#182f25"/>
  <text x="48" y="461" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">CI-ready JSON output</text>
</svg>
